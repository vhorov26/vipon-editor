<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор Текста</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFFFFF'><path d='M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z'/></svg>">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            /* БАЗОВАЯ (СВЕТЛАЯ) */
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --table-header: #F3F4F6;
            --code-bg: #FAFAFA;
            
            --primary: #4B5563;
            --primary-hover: #374151;
            --highlight: rgba(75, 85, 99, 0.1);

            --export-html: #E34F26;
            --export-md: #000000;
            --export-bb: #2C5282;
            --danger: #EF4444;
            --danger-hover: #DC2626;
        }

        /* БАЗОВАЯ (ТЕМНАЯ) */
        [data-theme-mode="dark"] {
            --bg: #111827;
            --card-bg: #1F2937;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
            --border: #374151;
            --table-header: #111827;
            --code-bg: #15171A;
            
            --primary: #9CA3AF;
            --primary-hover: #D1D5DB;
            --highlight: rgba(156, 163, 175, 0.15);

            --export-md: #FFFFFF;
            --export-bb: #63B3ED;
            --danger: #F87171;
            --danger-hover: #EF4444;
        }

        /* ЦВЕТОВЫЕ ТЕМЫ */
        [data-color="aubergine"] { --primary: #702459; --primary-hover: #4A154B; }
        [data-theme-mode="dark"][data-color="aubergine"] { --primary: #D9A5D6; --primary-hover: #E8BBE5; }

        [data-color="ocean"] { --primary: #0284C7; --primary-hover: #0369A1; }
        [data-theme-mode="dark"][data-color="ocean"] { --primary: #38BDF8; --primary-hover: #7DD3FC; }

        [data-color="forest"] { --primary: #059669; --primary-hover: #047857; }
        [data-theme-mode="dark"][data-color="forest"] { --primary: #34D399; --primary-hover: #6EE7B7; }

        [data-color="sunset"] { --primary: #EA580C; --primary-hover: #C2410C; }
        [data-theme-mode="dark"][data-color="sunset"] { --primary: #FB923C; --primary-hover: #FDBA74; }

        [data-color="indigo"] { --primary: #4F46E5; --primary-hover: #4338CA; }
        [data-theme-mode="dark"][data-color="indigo"] { --primary: #818CF8; --primary-hover: #A5B4FC; }

        [data-color="rose"] { --primary: #E11D48; --primary-hover: #BE123C; }
        [data-theme-mode="dark"][data-color="rose"] { --primary: #FB7185; --primary-hover: #FDA4AF; }

        /* ОСНОВНЫЕ СТИЛИ (Компактный масштаб) */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 1.5rem 1rem;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: background-color 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 { font-size: 18px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 22px; height: 22px; fill: var(--primary); transition: fill 0.3s; }

        .settings-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        select, input, button {
            font-family: 'Inter', sans-serif;
            padding: 0.3rem 0.6rem;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            height: 32px;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        select:focus, input:focus { border-color: var(--primary); }

        .editor-wrapper {
            border-radius: 8px 8px 0 0;
            overflow: hidden;
            border: 1px solid var(--border);
            border-bottom: none;
        }

        .source-stub {
            background: var(--table-header);
            border: 1px solid var(--border);
            border-radius: 0 0 8px 8px;
            padding: 0.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
            margin-bottom: 1rem;
        }
        
        .source-stub:hover { background: var(--border); color: var(--text-main); }
        .source-stub svg { width: 16px; height: 16px; fill: currentColor; }

        /* Обновленный блок контролов */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .controls-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0.4rem 0.8rem;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            color: white;
            min-width: 140px;
            justify-content: center;
            height: 32px;
        }
        
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: translateY(1px); }

        .btn-html { background: var(--export-html); }
        .btn-md { background: var(--export-md); color: var(--bg); border: 1px solid var(--border); }
        [data-theme-mode="dark"] .btn-md { color: #000; }
        .btn-bb { background: var(--export-bb); }
        
        /* Кнопка очистки унесена вправо и сделана квадратной */
        .btn-clear { 
            background: var(--danger); 
            min-width: 32px; 
            width: 32px;
            padding: 0; 
            margin-left: auto;
        }
        .btn-clear:hover { background: var(--danger-hover); }
        .btn-clear svg { width: 18px; height: 18px; fill: currentColor; }

        .btn svg { width: 14px; height: 14px; fill: currentColor; }
        
        .tox-notification--warning { display: none !important; }

        /* МОДАЛЬНОЕ ОКНО */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 900px;
            height: 80vh;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1.25rem;
            background: var(--table-header);
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            margin: 0;
            font-size: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-modal {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-modal:hover { background: var(--border); color: var(--text-main); }

        .modal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--code-bg);
        }

        .modal-textarea {
            flex: 1;
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text-main);
            padding: 1.25rem;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: none;
            outline: none;
            box-sizing: border-box;
        }

        .modal-footer {
            padding: 0.75rem 1.25rem;
            background: var(--table-header);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-cancel:hover { background: var(--border); }
        
        .btn-apply { background: var(--primary); color: white; border: none; }
        [data-theme-mode="dark"] .btn-apply { color: #111827; }
        .btn-apply:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
                <span id="ui-title">Редактирование текста</span>
            </h1>
            
            <div class="settings-row">
                <select id="langSelect">
                    <option value="ru">Русский</option>
                    <option value="uk">Українська</option>
                    <option value="en">English</option>
                </select>

                <select id="themeSelect">
                    <option value="base" id="opt-theme-base">Базовая тема</option>
                    <option value="aubergine" id="opt-theme-aubergine">Баклажан (Aubergine)</option>
                    <option value="indigo" id="opt-theme-indigo">Индиго (Indigo)</option>
                    <option value="ocean" id="opt-theme-ocean">Океан (Ocean)</option>
                    <option value="forest" id="opt-theme-forest">Лес (Forest)</option>
                    <option value="sunset" id="opt-theme-sunset">Закат (Sunset)</option>
                    <option value="rose" id="opt-theme-rose">Роза (Rose)</option>
                </select>

                <select id="modeSelect">
                    <option value="auto" id="opt-mode-auto">💻 Авто</option>
                    <option value="light" id="opt-mode-light">☀️ Светлая</option>
                    <option value="dark" id="opt-mode-dark">🌙 Темная</option>
                </select>
            </div>
        </div>

        <div class="editor-wrapper">
            <textarea id="main-editor"></textarea>
        </div>
        <div class="source-stub" id="openSourceStub">
            <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
            <span id="source-stub-text">Редактировать Source Code (HTML)</span>
        </div>
        
        <div class="controls">
            <div class="controls-group">
                <button class="btn btn-html" id="btn-copy-html">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    <span id="btn-copy-html-text">Скопировать HTML</span>
                </button>
                
                <button class="btn btn-md" id="btn-copy-md">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    <span id="btn-copy-md-text">Скопировать Markdown</span>
                </button>
                
                <button class="btn btn-bb" id="btn-copy-bb">
                    <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    <span id="btn-copy-bb-text">Скопировать BBCode</span>
                </button>
            </div>

            <!-- Кнопка очистки в правом углу -->
            <button class="btn btn-clear" id="btn-clear-all" title="Очистить все">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="sourceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                    <span id="modal-title-text">Редактор Исходного Кода</span>
                </h2>
                <button class="close-modal" id="closeModalIcon">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <textarea id="modalHtmlArea" class="modal-textarea" spellcheck="false" placeholder="Вставьте или отредактируйте HTML код здесь..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="cancelModalBtn">Отмена</button>
                <button class="btn btn-apply" id="applyModalBtn">Применить код</button>
            </div>
        </div>
    </div>

    <script>
        const i18n = {
            ru: {
                title: "Редактирование текста", btnHtml: "Скопировать HTML", btnMd: "Скопировать Markdown", btnBb: "Скопировать BBCode",
                sourceStub: "Редактировать Source Code (HTML)", modalTitle: "Редактор Исходного Кода", btnCancel: "Отмена", btnApply: "Применить код",
                modalPlaceholder: "Вставьте или отредактируйте HTML код здесь...",
                tBase: "Базовая тема", tAuber: "Баклажан (Aubergine)", tInd: "Индиго (Indigo)", tOcean: "Океан (Ocean)", tFor: "Лес (Forest)", tSun: "Закат (Sunset)", tRose: "Роза (Rose)",
                mAuto: "💻 Авто", mLight: "☀️ Светлая", mDark: "🌙 Темная", titleClear: "Очистить все"
            },
            uk: {
                title: "Редагування тексту", btnHtml: "Скопіювати HTML", btnMd: "Скопіювати Markdown", btnBb: "Скопіювати BBCode",
                sourceStub: "Редагувати Source Code (HTML)", modalTitle: "Редактор Вихідного Коду", btnCancel: "Скасувати", btnApply: "Застосувати код",
                modalPlaceholder: "Вставте або відредагуйте HTML код тут...",
                tBase: "Базова тема", tAuber: "Баклажан (Aubergine)", tInd: "Індиго (Indigo)", tOcean: "Океан (Ocean)", tFor: "Ліс (Forest)", tSun: "Захід (Sunset)", tRose: "Троянда (Rose)",
                mAuto: "💻 Авто", mLight: "☀️ Світла", mDark: "🌙 Темна", titleClear: "Очистити все"
            },
            en: {
                title: "Text Editor", btnHtml: "Copy HTML", btnMd: "Copy Markdown", btnBb: "Copy BBCode",
                sourceStub: "Edit Source Code (HTML)", modalTitle: "Source Code Editor", btnCancel: "Cancel", btnApply: "Apply Code",
                modalPlaceholder: "Paste or edit HTML code here...",
                tBase: "Base Theme", tAuber: "Aubergine", tInd: "Indigo", tOcean: "Ocean", tFor: "Forest", tSun: "Sunset", tRose: "Rose",
                mAuto: "💻 Auto", mLight: "☀️ Light", mDark: "🌙 Dark", titleClear: "Clear All"
            }
        };

        // --- ИНИЦИАЛИЗАЦИЯ ЯЗЫКА ---
        let currentLang = localStorage.getItem('appLang');
        if (!currentLang) {
            const sysLang = navigator.language.slice(0, 2);
            currentLang = ['ru', 'uk', 'en'].includes(sysLang) ? sysLang : 'en';
        }

        const langSelect = document.getElementById('langSelect');
        const themeSelect = document.getElementById('themeSelect');
        const modeSelect = document.getElementById('modeSelect');

        langSelect.value = currentLang;
        modeSelect.value = localStorage.getItem('themeMode') || 'auto';
        themeSelect.value = localStorage.getItem('themeColor') || 'base';

        function updateUI() {
            const t = i18n[currentLang];
            document.title = t.title;
            document.getElementById('ui-title').textContent = t.title;
            document.getElementById('btn-copy-html-text').textContent = t.btnHtml;
            document.getElementById('btn-copy-md-text').textContent = t.btnMd;
            document.getElementById('btn-copy-bb-text').textContent = t.btnBb;
            document.getElementById('source-stub-text').textContent = t.sourceStub;
            document.getElementById('modal-title-text').textContent = t.modalTitle;
            document.getElementById('cancelModalBtn').textContent = t.btnCancel;
            document.getElementById('applyModalBtn').textContent = t.btnApply;
            document.getElementById('modalHtmlArea').placeholder = t.modalPlaceholder;

            document.getElementById('opt-theme-base').textContent = t.tBase;
            document.getElementById('opt-theme-aubergine').textContent = t.tAuber;
            document.getElementById('opt-theme-indigo').textContent = t.tInd;
            document.getElementById('opt-theme-ocean').textContent = t.tOcean;
            document.getElementById('opt-theme-forest').textContent = t.tFor;
            document.getElementById('opt-theme-sunset').textContent = t.tSun;
            document.getElementById('opt-theme-rose').textContent = t.tRose;

            document.getElementById('opt-mode-auto').textContent = t.mAuto;
            document.getElementById('opt-mode-light').textContent = t.mLight;
            document.getElementById('opt-mode-dark').textContent = t.mDark;

            document.getElementById('btn-clear-all').title = t.titleClear;
        }

        langSelect.addEventListener('change', (e) => {
            currentLang = e.target.value;
            localStorage.setItem('appLang', currentLang);
            updateUI();
        });

        // --- ТЕМЫ И TINYMCE ---
        const body = document.body;

        const getActualMode = () => {
            let mode = modeSelect.value;
            if (mode === 'auto') {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            return mode;
        };

        const applyThemeMode = (reinitEditor = true) => {
            const actualMode = getActualMode();
            body.setAttribute('data-theme-mode', actualMode);

            if (reinitEditor && tinymce.activeEditor) {
                const currentContent = tinymce.activeEditor.getContent();
                tinymce.remove('#main-editor');
                document.getElementById('main-editor').value = currentContent;
                initEditor(actualMode === 'dark');
            }
        };

        const applyThemeColor = () => body.setAttribute('data-color', themeSelect.value);

        modeSelect.addEventListener('change', (e) => {
            localStorage.setItem('themeMode', e.target.value);
            applyThemeMode(true);
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (modeSelect.value === 'auto') applyThemeMode(true);
        });

        themeSelect.addEventListener('change', (e) => {
            localStorage.setItem('themeColor', e.target.value);
            applyThemeColor();
        });

        // --- ЗАГРУЗКА СКРИНШОТОВ НА MYVIPON ЧЕРЕЗ NETLIFY FUNCTION ---
        function uploadViaNetlify(blobInfo, progress) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('upload', blobInfo.blob(), blobInfo.filename() || `screenshot_${Date.now()}.png`);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/.netlify/functions/upload');

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        progress((e.loaded / e.total) * 100);
                    }
                };

                xhr.onload = () => {
                    try {
                        const json = JSON.parse(xhr.responseText);
                        if (xhr.status >= 200 && xhr.status < 300 && json.uploaded && json.url) {
                            resolve(json.url);
                        } else {
                            reject({ message: json.error || `Ошибка загрузки: HTTP ${xhr.status}`, remove: true });
                        }
                    } catch (err) {
                        reject({ message: 'Не удалось обработать ответ сервера Netlify. Убедитесь, что сайт запущен на Netlify.', remove: true });
                    }
                };

                xhr.onerror = () => {
                    reject({ message: 'Ошибка сети при загрузке изображения.', remove: true });
                };

                xhr.send(formData);
            });
        }

        // --- ИНИЦИАЛИЗАЦИЯ РЕДАКТОРА ---
        function initEditor(isDark) {
            tinymce.init({
                selector: '#main-editor',
                entity_encoding: 'raw', 
                height: 600,
                statusbar: true,
                elementpath: false,
                resize: 'vertical',
                toolbar_mode: 'wrap',

                paste_data_images: true,
                automatic_uploads: true,
                images_file_types: 'jpg,svg,webp,png,gif,jpeg',
                images_upload_handler: (blobInfo, progress) => uploadViaNetlify(blobInfo, progress),

                menu: {
                    file: { title: 'File', items: 'newdocument restoredraft | preview | print ' },
                    edit: { title: 'Edit', items: 'undo redo | cut copy paste | selectall' },
                    view: { title: 'View', items: 'visualaid visualchars visualblocks | spellchecker | preview fullscreen' },
                    insert: { title: 'Insert', items: 'image link media template codesample inserttable | charmap emoticons hr | pagebreak nonbreaking anchor toc | insertdatetime' },
                    format: { title: 'Format', items: 'bold italic underline strikethrough superscript subscript codeformat | formats blockformats fontformats fontsizes align | forecolor backcolor | removeformat' },
                    tools: { title: 'Tools', items: 'wordcount' }, 
                    table: { title: 'Table', items: 'inserttable | cell row column | tableprops deletetable' },
                    help: { title: 'Help', items: 'help' }
                },
                menubar: 'file edit view insert format tools table help',
                plugins: 'preview importcss autolink autosave save directionality visualblocks visualchars fullscreen image link media template codesample table charmap pagebreak nonbreaking anchor insertdatetime advlist lists wordcount help charmap quickbars emoticons',
                toolbar: 'undo redo | bold italic underline strikethrough | fontfamily fontsize blocks | alignleft aligncenter alignright alignjustify | outdent indent | numlist bullist | forecolor backcolor removeformat | charmap emoticons | fullscreen preview print | insertfile image media link codesample | ltr rtl | help',
                skin: isDark ? 'oxide-dark' : 'oxide',
                content_css: isDark ? 'dark' : 'default',
                branding: false,
                promotion: false,
                setup: function (editor) {
                    editor.on('init', function () {
                        if (document.getElementById('main-editor').value) {
                            editor.setContent(document.getElementById('main-editor').value);
                        }
                    });
                }
            });
        }

        // ПЕРВИЧНАЯ ЗАГРУЗКА
        updateUI();
        applyThemeColor();
        const initialMode = getActualMode();
        body.setAttribute('data-theme-mode', initialMode);
        initEditor(initialMode === 'dark');

        // --- ЛОГИКА МОДАЛЬНОГО ОКНА ---
        const sourceModal = document.getElementById('sourceModal');
        const openSourceStub = document.getElementById('openSourceStub');
        const closeModalIcon = document.getElementById('closeModalIcon');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const applyModalBtn = document.getElementById('applyModalBtn');
        const modalHtmlArea = document.getElementById('modalHtmlArea');

        function openModal() {
            if(tinymce.activeEditor) {
                modalHtmlArea.value = tinymce.activeEditor.getContent();
            }
            sourceModal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            sourceModal.style.display = 'none';
            document.body.style.overflow = 'auto'; 
        }

        function applyHtml() {
            if(tinymce.activeEditor) {
                tinymce.activeEditor.setContent(modalHtmlArea.value);
            }
            closeModal();
        }

        openSourceStub.addEventListener('click', openModal);
        closeModalIcon.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);
        applyModalBtn.addEventListener('click', applyHtml);

        sourceModal.addEventListener('click', (e) => {
            if (e.target === sourceModal) closeModal();
        });

        // --- ЛОГИКА КОПИРОВАНИЯ И ОЧИСТКИ ---
        document.getElementById('btn-clear-all').addEventListener('click', function() {
            if (tinymce.activeEditor) {
                tinymce.activeEditor.setContent('');
            }
        });

        function copyToClipboard(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const span = btn.querySelector('span');
                const originalText = span.textContent;
                const originalHtml = btn.innerHTML;
                
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> <span>Скопировано!</span>`;
                btn.style.opacity = "0.7";
                
                setTimeout(() => { 
                    btn.innerHTML = originalHtml; 
                    btn.style.opacity = "1";
                    btn.querySelector('span').textContent = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Ошибка копирования: ', err);
                alert('Не удалось скопировать текст. Проверьте разрешения браузера.');
            });
        }

        document.getElementById('btn-copy-html').addEventListener('click', function() {
            copyToClipboard(this, tinymce.activeEditor.getContent());
        });

        const turndownService = new TurndownService({
            headingStyle: 'atx',
            hr: '---',
            bulletListMarker: '-',
            codeBlockStyle: 'fenced'
        });

        document.getElementById('btn-copy-md').addEventListener('click', function() {
            const markdown = turndownService.turndown(tinymce.activeEditor.getContent());
            copyToClipboard(this, markdown);
        });

        function convertToBBCode(html) {
            let bb = html;
            bb = bb.replace(/<strong>(.*?)<\/strong>/gi, "[b]$1[/b]");
            bb = bb.replace(/<b>(.*?)<\/b>/gi, "[b]$1[/b]");
            bb = bb.replace(/<em>(.*?)<\/em>/gi, "[i]$1[/i]");
            bb = bb.replace(/<i>(.*?)<\/i>/gi, "[i]$1[/i]");
            bb = bb.replace(/<u>(.*?)<\/u>/gi, "[u]$1[/u]");
            bb = bb.replace(/<span style="text-decoration: underline;">(.*?)<\/span>/gi, "[u]$1[/u]");
            bb = bb.replace(/<s>(.*?)<\/s>/gi, "[s]$1[/s]");
            bb = bb.replace(/<a[^>]*href="([^"]+)"[^>]*>(.*?)<\/a>/gi, "[url=$1]$2[/url]");
            bb = bb.replace(/<img[^>]*src="([^"]+)"[^>]*>/gi, "[img]$1[/img]");
            bb = bb.replace(/<ul>/gi, "[list]\n");
            bb = bb.replace(/<\/ul>/gi, "[/list]\n");
            bb = bb.replace(/<ol>/gi, "[list=1]\n");
            bb = bb.replace(/<\/ol>/gi, "[/list]\n");
            bb = bb.replace(/<li>(.*?)<\/li>/gi, "[*]$1\n");
            for (let i = 1; i <= 6; i++) {
                const regex = new RegExp(`<h${i}>(.*?)<\/h${i}>`, "gi");
                bb = bb.replace(regex, `[size=${8-i}][b]$1[/b][/size]\n\n`);
            }
            bb = bb.replace(/<br\s*[\/]?>/gi, "\n");
            bb = bb.replace(/<p>(.*?)<\/p>/gi, "$1\n\n");
            bb = bb.replace(/<[^>]+>/g, '');
            
            const txt = document.createElement("textarea");
            txt.innerHTML = bb;
            return txt.value.trim();
        }

        document.getElementById('btn-copy-bb').addEventListener('click', function() {
            const bbcode = convertToBBCode(tinymce.activeEditor.getContent());
            copyToClipboard(this, bbcode);
        });
    </script>
</body>
</html>
